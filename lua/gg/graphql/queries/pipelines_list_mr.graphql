#import "pipeline"
query PipelinesListMr($fullPath: ID!, $iid: String!, $first: Int, $after: String, $status: PipelineStatusEnum) {
  project(fullPath: $fullPath) {
    mergeRequest(iid: $iid) {
      pipelines(first: $first, after: $after, status: $status) {
        nodes {
          ...PipelineFields
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
