#import "user"
query MrCommits($fullPath: ID!, $iid: String!, $first: Int, $after: String) {
  project(fullPath: $fullPath) {
    mergeRequest(iid: $iid) {
      commits(first: $first, after: $after) {
        nodes {
          sha
          shortId
          title
          message
          authorName
          authorEmail
          authoredDate
          committerName
          committedDate
          webUrl
          author {
            ...UserFields
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
