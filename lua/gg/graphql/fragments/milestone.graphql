fragment MilestoneFields on Milestone {
  id
  iid
  title
  description
  state
  startDate
  dueDate
  expired
  webPath
  # Issue counts across every project the milestone covers (group milestones too).
  stats {
    totalIssuesCount
    closedIssuesCount
  }
  createdAt
  updatedAt
  project {
    fullPath
  }
  group {
    fullPath
  }
}
