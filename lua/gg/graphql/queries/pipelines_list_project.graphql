#import "pipeline"
# `refPath` (refs/heads/... or refs/tags/...) gives the tag flag; see
# pipelines_list_project_base for GitLab versions without it or `mergeRequest`.
query PipelinesListProject(
  $fullPath: ID!
  $first: Int
  $after: String
  $status: PipelineStatusEnum
  $scope: PipelineScopeEnum
  $ref: String
  $sha: String
  $source: String
  $username: String
  $ids: [ID!]
) {
  project(fullPath: $fullPath) {
    pipelines(
      first: $first
      after: $after
      status: $status
      scope: $scope
      ref: $ref
      sha: $sha
      source: $source
      username: $username
      ids: $ids
    ) {
      nodes {
        ...PipelineFields
        refPath
        mergeRequest {
          iid
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
