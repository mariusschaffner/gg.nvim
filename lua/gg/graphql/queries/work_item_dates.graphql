query WorkItemDates($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    workItem(iid: $iid) {
      id
      iid
      widgets(onlyTypes: [START_AND_DUE_DATE]) {
        type
        ... on WorkItemWidgetStartAndDueDate {
          startDate
          dueDate
        }
      }
    }
  }
}
